<!doctype html><html><head><title>Acme - Junior Backend Engineer</title></head><body>
<h2>Junior Backend Engineer</h2>
<form id="application-form" method="POST" action="/submit" enctype="multipart/form-data">
  <ul>
    <li class="application-question"><label><div class="application-label">Resume/CV ✱</div>
      <div class="application-field"><input type="file" name="resume" id="resume-upload-input" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Full name✱</div>
      <div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email✱</div>
      <div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div>
      <div class="application-field"><input type="text" name="phone"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current location</div>
      <div class="application-field"><input type="text" name="location"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div>
      <div class="application-field"><input type="text" name="org"></div></label></li>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
      <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div>
      <div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
    <li class="application-question"><label><div class="application-label">Portfolio URL</div>
      <div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
  </ul>
  <div class="application-question custom-question">
    <div class="application-label">Will you now or in the future require visa sponsorship to work in Germany?✱</div>
    <div class="application-field"><ul>
      <li><label><input type="radio" name="cards[a1][field0]" value="Yes" required><span>Yes</span></label></li>
      <li><label><input type="radio" name="cards[a1][field0]" value="No"><span>No</span></label></li>
    </ul></div>
  </div>
  <div class="application-question custom-question">
    <div class="application-label">Are you legally authorized to work in Germany?✱</div>
    <div class="application-field"><select name="cards[a1][field1]" required>
      <option value="">Select...</option><option>Yes</option><option>No</option></select></div>
  </div>
  <div class="application-question"><label><div class="application-label">Additional information</div>
    <div class="application-field"><textarea name="comments"></textarea></div></label></div>
  <input type="hidden" name="timezone" value="">
  <button type="submit" id="btn-submit">Submit application</button>
</form></body></html>
